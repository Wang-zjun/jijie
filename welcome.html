<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>解集 · Solution Set Site — 登录</title>
<link id="wtheme" rel="stylesheet" href="css/theme-neon.css">
<link rel="stylesheet" href="css/welcome.css">
</head>
<body>
<div id="stage"></div>

<!-- 直接登录/注册 -->
<section class="step active" data-step="1">
  <div class="logo">解集<small>SOLUTION SET SITE</small></div>
  <p class="slogan">这里是数竞生的一方天地。<br>集合每一道难题，也集合每一个解出它的瞬间。</p>
  <div class="authbox">
    <div class="tabs">
      <button class="tab" id="tab-login" onclick="setTab('login')">登录</button>
      <button class="tab" id="tab-reg" onclick="setTab('reg')">注册</button>
    </div>
    <div class="err" id="autherr"></div>
    <form id="loginform">
      <div class="field"><label>邮箱</label><input id="lu" placeholder="输入邮箱" autocomplete="email"></div>
      <div class="field"><label>密码</label><input id="lp" type="password" placeholder="输入密码" autocomplete="current-password"></div>
      <button class="btn primary" type="submit" style="width:100%;margin-top:6px">登录</button>
    </form>
    <form id="regform" style="display:none">
      <div class="field"><label>邮箱</label><input id="ru" placeholder="你的邮箱，用于登录"></div>
      <div class="field"><label>昵称（可选）</label><input id="rn" placeholder="展示用的名字"></div>
      <div class="field"><label>密码</label><input id="rp" type="password" placeholder="至少 6 位"></div>
      <div class="field"><label>确认密码</label><input id="rp2" type="password" placeholder="再次输入密码"></div>
      <button class="btn primary" type="submit" style="width:100%;margin-top:6px">注册并进入</button>
    </form>
    <p class="hint">账号数据已接入云端（Supabase），注册用邮箱，跨设备可同步登录。换主题请在登录后到侧边栏「切换主题」。</p>
  </div>
</section>

<script src="js/supabase.js"></script>
<script src="js/store.js"></script>
<script src="data/seed.js"></script>
<script src="js/welcome.js"></script>
</body>
</html>
